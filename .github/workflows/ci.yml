name: CI

# Verification only — never deploys (production deploy lives in deploy.yml, on push to main).
# Events (branch policy: dev = integration, main = production):
#   - pull_request -> dev or main : full verification of the proposed merge
#   - push         -> dev         : verification of the integration branch
# main is deliberately NOT a push trigger here: a push to main is handled by deploy.yml,
# which re-runs the same verification against the exact merged SHA before deploying. No
# path filters — every change to these branches is fully verified (no accidental skips).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Advisory branch-policy guard (Free plan). GitHub branch protection / rulesets are
  # unavailable on this plan, so this cannot be made unbypassable — it only REPORTS an
  # unexpected promotion path. Enforcement is procedural (see the deployment runbook).
  policy:
    name: Branch-policy guard (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check promotion path
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "PR promotion path: '$HEAD' -> '$BASE'"
          ok=1
          case "$BASE" in
            dev)
              case "$HEAD" in
                feature/*|fix/*|chore/*|hotfix/*|dependabot/*|renovate/*) ok=0 ;;
              esac ;;
            main)
              case "$HEAD" in
                dev|hotfix/*) ok=0 ;;
              esac ;;
          esac
          if [ "$ok" -eq 0 ]; then
            echo "✅ Allowed promotion path: '$HEAD' -> '$BASE'." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Branch policy::Unexpected promotion path '$HEAD' -> '$BASE'. Expected feature/*|fix/*|chore/* -> dev, and dev|hotfix/* -> main. ADVISORY only (branch protection is unavailable on the Free plan)."
            {
              echo "### ⚠️ Branch-policy advisory"
              echo "Unexpected promotion path: \`$HEAD\` -> \`$BASE\`."
              echo ""
              echo "- PRs to \`dev\` should originate from \`feature/*\`, \`fix/*\`, \`chore/*\` (or \`hotfix/*\` back-merges / bot branches)."
              echo "- PRs to \`main\` should originate from \`dev\` or \`hotfix/*\`."
              echo ""
              echo "_Advisory only — GitHub cannot enforce branch protection on this plan, so this does not block the merge._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Advisory: never fail the build on a policy mismatch.
          exit 0

  # M1 quality gate (doc 17). Runs with no API dependency — Vitest passes without a backend,
  # and the build + bundle-isolation check assert the two-worlds boundary (D06-1/D06-5).
  verify:
    name: Lint · Typecheck · Test · Build · Isolation
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders; the real hosts are injected per environment at runtime (D23-8).
      # A non-localhost origin also keeps @nuxtjs/seo's site-config quiet during the build.
      NUXT_PUBLIC_SITE_URL: https://example.com
      NUXT_PUBLIC_API_BASE: https://example.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs the `postinstall` hook (`nuxt prepare`), which generates `.nuxt/` — including
      # the ESLint flat config and typed auto-imports that lint and typecheck rely on.
      - name: Install dependencies
        run: npm ci

      - name: Enforce API types idempotence
        # app/types/api.d.ts must be a fixed point of `api:types` over the committed
        # openapi/openapi.json (doc 16 §3, contract adoption is one atomic commit). Compare
        # at the content level (git's --exit-status stat cache false-positives after regen).
        run: |
          npm run api:types
          if git show HEAD:app/types/api.d.ts | diff -u - app/types/api.d.ts; then
            echo "app/types/api.d.ts is a fixed point of api:types."
          else
            echo "::error::app/types/api.d.ts is stale vs openapi/openapi.json — run 'npm run api:types' and commit the result (doc 16 §3)." >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `ANALYZE_BUNDLE=1` emits Rollup chunk→module provenance as a SIDECAR file
      # (.bundle-analysis/). This is REQUIRED, not optional: without it the per-route gate cannot
      # measure §1's ≤101 KiB app-owned renderedLength budget at all and exits 2 (infrastructure),
      # so dropping this flag breaks the gate rather than silently loosening it. Verified
      # byte-identical to a plain build (27 client assets, matching SHA256s), so CI still measures
      # exactly what the deploy ships. The gate also cross-checks that this sidecar describes THIS
      # build, so a stale one fails rather than producing a confidently wrong number.
      - name: Build
        run: ANALYZE_BUNDLE=1 npm run build

      # doc 20 §5 order: build → size-limit → forbidden-module check → Lighthouse CI.
      # Budgets are doc 20 §1 verbatim; §1 states they "block merges, not aspirations" and are
      # "re-baselined only by a decision-log entry" there. Split by what each tool can state
      # correctly: this step asserts CSS (one global stylesheet, so the glob total IS the per-route
      # figure — .size-limit.cjs); the next asserts the per-route JS budget.
      - name: Assert CSS size budget (doc 20 §1)
        run: npm run size

      # Per-public-route JS budgets: total ≤ 250 KB gz (D20-11) and app-owned Rollup
      # renderedLength ≤ 101 KiB (D20-12, a FROZEN constant — this gate never recalculates the
      # limit from the build it is measuring, because a budget refitted to each build measures
      # nothing). §1 budgets JS "per public route", which a static glob cannot express (it would
      # also sum the dashboard SPA chunks no public route fetches), so this boots the production
      # preview and reads each route's real first-view asset set.
      # Exit codes are distinct and must stay that way: 1 = genuine breach (total, app-owned, or
      # unclassified module bytes in a valid build); 2 = the gate could not measure (missing build,
      # missing/corrupt/stale provenance, unreachable preview). Never conflate them.
      - name: Assert per-route size budgets (doc 20 §1)
        run: npm run size:routes

      - name: Assert bundle isolation
        run: npm run check:bundle

      - name: Assert logical properties (RTL)
        run: npm run check:logical

      # Lighthouse CI against the built artifact behind a Prism mock of the committed contract
      # (scripts/ci-preview.mjs) — deterministic, and independent of staging uptime or data.
      # home + article × EN/AR; `/projects` and `/contact` from doc 20 §5's four-page matrix are
      # the accepted web-005 404s (spec.md:36) and are deferred with it, not silently dropped.
      # ubuntu-latest ships Chrome preinstalled, so no browser download step is needed.
      # COLLECT ONLY — 3 runs per URL per profile, into .lighthouseci/<profile>/. Thresholds are
      # asserted in the next step, not here: D20-13's semantics (exactly three comparable runs,
      # grouped by run configuration, where FEWER than three is infrastructure rather than a low
      # score) cannot be expressed as an LHCI assertion list. Separate output directories keep the
      # second profile from overwriting the first profile's evidence.
      - name: Lighthouse CI collect — mobile profile (doc 20 §5)
        run: npm run lhci

      - name: Lighthouse CI collect — desktop profile (doc 20 §5)
        run: npm run lhci:desktop

      # Median-of-3 thresholds (doc 20 §1, D20-13): Performance ≥ 95 desktop / ≥ 60 mobile;
      # Accessibility, Best Practices and SEO 100; LCP, CLS and per-script fonts at their unchanged
      # §1 limits. Every individual run is printed so a median cannot hide instability. Exit 1 =
      # a real regression; exit 2 = the collection was incomplete or unreadable.
      - name: Assert Lighthouse medians (doc 20 §1)
        run: npm run lhci:assert

      # Reports are preserved even when the assertions fail — that is when they are most useful.
      # Both profile subdirectories are included, so all three runs behind every median remain
      # inspectable after the fact.
      #
      # `include-hidden-files: true` is REQUIRED, not cosmetic. `.lighthouseci/` is dot-prefixed, and
      # actions/upload-artifact@v4 defaults that input to false — so run 30221448099 uploaded ZERO
      # files while the step itself reported success, and the only surviving evidence for the whole
      # baseline was the assertion step's stdout. The raw LHR JSON for all 24 readings is
      # unrecoverable. `if-no-files-found: error` makes the next silent loss impossible: this step
      # runs on `always()` immediately after a gate that is expected to fail sometimes, so "no files"
      # always means the collection or the path is broken, never a legitimate empty result.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.sha }}
          path: .lighthouseci/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
