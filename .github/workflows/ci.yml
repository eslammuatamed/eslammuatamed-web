name: CI

# Verification only — never deploys (production deploy lives in deploy.yml, on push to main).
# Events (branch policy: dev = integration, main = production):
#   - pull_request -> dev or main : full verification of the proposed merge
#   - push         -> dev         : verification of the integration branch
# main is deliberately NOT a push trigger here: a push to main is handled by deploy.yml,
# which re-runs the same verification against the exact merged SHA before deploying. No
# path filters — every change to these branches is fully verified (no accidental skips).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Advisory branch-policy guard (Free plan). GitHub branch protection / rulesets are
  # unavailable on this plan, so this cannot be made unbypassable — it only REPORTS an
  # unexpected promotion path. Enforcement is procedural (see the deployment runbook).
  policy:
    name: Branch-policy guard (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check promotion path
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "PR promotion path: '$HEAD' -> '$BASE'"
          ok=1
          case "$BASE" in
            dev)
              case "$HEAD" in
                feature/*|fix/*|chore/*|hotfix/*|dependabot/*|renovate/*) ok=0 ;;
              esac ;;
            main)
              case "$HEAD" in
                dev|hotfix/*) ok=0 ;;
              esac ;;
          esac
          if [ "$ok" -eq 0 ]; then
            echo "✅ Allowed promotion path: '$HEAD' -> '$BASE'." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Branch policy::Unexpected promotion path '$HEAD' -> '$BASE'. Expected feature/*|fix/*|chore/* -> dev, and dev|hotfix/* -> main. ADVISORY only (branch protection is unavailable on the Free plan)."
            {
              echo "### ⚠️ Branch-policy advisory"
              echo "Unexpected promotion path: \`$HEAD\` -> \`$BASE\`."
              echo ""
              echo "- PRs to \`dev\` should originate from \`feature/*\`, \`fix/*\`, \`chore/*\` (or \`hotfix/*\` back-merges / bot branches)."
              echo "- PRs to \`main\` should originate from \`dev\` or \`hotfix/*\`."
              echo ""
              echo "_Advisory only — GitHub cannot enforce branch protection on this plan, so this does not block the merge._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Advisory: never fail the build on a policy mismatch.
          exit 0

  # M1 quality gate (doc 17). Runs with no API dependency — Vitest passes without a backend,
  # and the build + bundle-isolation check assert the two-worlds boundary (D06-1/D06-5).
  verify:
    name: Lint · Typecheck · Test · Build · Isolation
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders; the real hosts are injected per environment at runtime (D23-8).
      # A non-localhost origin also keeps @nuxtjs/seo's site-config quiet during the build.
      NUXT_PUBLIC_SITE_URL: https://example.com
      NUXT_PUBLIC_API_BASE: https://example.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs the `postinstall` hook (`nuxt prepare`), which generates `.nuxt/` — including
      # the ESLint flat config and typed auto-imports that lint and typecheck rely on.
      - name: Install dependencies
        run: npm ci

      - name: Enforce API types idempotence
        # app/types/api.d.ts must be a fixed point of `api:types` over the committed
        # openapi/openapi.json (doc 16 §3, contract adoption is one atomic commit). Compare
        # at the content level (git's --exit-status stat cache false-positives after regen).
        run: |
          npm run api:types
          if git show HEAD:app/types/api.d.ts | diff -u - app/types/api.d.ts; then
            echo "app/types/api.d.ts is a fixed point of api:types."
          else
            echo "::error::app/types/api.d.ts is stale vs openapi/openapi.json — run 'npm run api:types' and commit the result (doc 16 §3)." >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `ANALYZE_BUNDLE=1` emits Rollup chunk→module provenance as a SIDECAR file
      # (.bundle-analysis/). This is REQUIRED, not optional: without it the per-route gate cannot
      # measure §1's ≤101 KiB app-owned renderedLength budget at all and exits 2 (infrastructure),
      # so dropping this flag breaks the gate rather than silently loosening it. Verified
      # byte-identical to a plain build (27 client assets, matching SHA256s), so CI still measures
      # exactly what the deploy ships. The gate also cross-checks that this sidecar describes THIS
      # build, so a stale one fails rather than producing a confidently wrong number.
      - name: Build
        run: ANALYZE_BUNDLE=1 npm run build

      # doc 20 §5 order: build → size-limit → forbidden-module check → Lighthouse CI.
      # Budgets are doc 20 §1 verbatim; §1 states they "block merges, not aspirations" and are
      # "re-baselined only by a decision-log entry" there. Split by what each tool can state
      # correctly: this step asserts CSS (one global stylesheet, so the glob total IS the per-route
      # figure — .size-limit.cjs); the next asserts the per-route JS budget.
      - name: Assert CSS size budget (doc 20 §1)
        run: npm run size

      # Per-public-route JS budgets: total ≤ 250 KB gz (D20-11) and app-owned Rollup
      # renderedLength ≤ 101 KiB (D20-12, a FROZEN constant — this gate never recalculates the
      # limit from the build it is measuring, because a budget refitted to each build measures
      # nothing). §1 budgets JS "per public route", which a static glob cannot express (it would
      # also sum the dashboard SPA chunks no public route fetches), so this boots the production
      # preview and reads each route's real first-view asset set.
      # Exit codes are distinct and must stay that way: 1 = genuine breach (total, app-owned, or
      # unclassified module bytes in a valid build); 2 = the gate could not measure (missing build,
      # missing/corrupt/stale provenance, unreachable preview). Never conflate them.
      - name: Assert per-route size budgets (doc 20 §1)
        run: npm run size:routes

      - name: Assert bundle isolation
        run: npm run check:bundle

      - name: Assert logical properties (RTL)
        run: npm run check:logical

  # Governed Lighthouse (D20-25), SHARDED BY PROFILE — one runner per governed run configuration.
  #
  # It used to be the last two steps of `verify`, where the two matrices ran end to end: 631 s
  # mobile + 617 s desktop, and a 49 s rebuild before either, for 1,300 s — 86 % of a 1,503 s job
  # and the single largest cost in either repo's CI (run 31646141906).
  #
  # NOTHING ABOUT THE MEASUREMENT CHANGED. Same 16 governed URLs, same 3 runs per URL per profile
  # (96 audits in total, as before), same thresholds, same HTTP/2 frontend, same protocol proofs.
  # The two matrices were already independent — separate `lhci` invocations writing to separate
  # directories, a protocol proof each, and medians grouped by each report's own
  # `configSettings.formFactor` — so profile is the one shard boundary that costs no semantics.
  #
  # Deliberately one runner PER PROFILE, never two matrices on one runner: Lighthouse performance
  # figures are CPU-sensitive and contending matrices would corrupt every reading.
  #
  # The DUPLICATE build disappears structurally rather than by relaxing anything. In `verify`, step 9
  # had already built with `ANALYZE_BUNDLE=1` (required by `size:routes`), whose build-environment
  # fingerprint the provenance contract correctly refuses to accept as governed output — so the
  # orchestrator quarantined that output and rebuilt it, 49 s of work discarded (run 31646141906).
  # A shard has no such build to quarantine: `.output` is simply absent, so it builds exactly once.
  # The provenance contract is UNTOUCHED and still rejects — only the reason changes, from
  # "fingerprint changed since the build" to "no provenance marker". What is gone is the second,
  # wasted build, not a check (run 31650938047 shows both rejection lines and one build per shard).
  #
  # BOTH shard contexts are required on `main`. That is what enforces cross-profile coverage now
  # that one process no longer collects both: `LH_PROFILES` selects the profile, `resolveProfile`
  # throws rather than defaulting, and each shard asserts it collected all 16 governed URLs for the
  # profile it was asked for (`assertGovernedUrlCoverage`, exit 2 = infrastructure).
  lighthouse:
    name: Lighthouse (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Both profiles always run to completion: a mobile regression must not hide the desktop
      # result, and the ruleset requires both contexts.
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    env:
      # Same build-time placeholders as `verify` — the fingerprint the provenance marker records.
      NUXT_PUBLIC_SITE_URL: https://example.com
      NUXT_PUBLIC_API_BASE: https://example.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture Lighthouse runner diagnostics
        shell: bash
        run: |
          printf 'timestamp_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'RUNNER_OS=%s\nRUNNER_ARCH=%s\nImageOS=%s\nImageVersion=%s\n' \
            "${RUNNER_OS:-unavailable}" "${RUNNER_ARCH:-unavailable}" \
            "${ImageOS:-unavailable}" "${ImageVersion:-unavailable}"

          command -v lscpu >/dev/null && lscpu || true
          command -v nproc >/dev/null && printf 'nproc=%s\n' "$(nproc)" || true
          [[ -r /proc/cpuinfo ]] && grep -m 1 '^model name' /proc/cpuinfo || true

          for path in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpuset.cpus /sys/fs/cgroup/cpuset.cpus.effective; do
            [[ -r "$path" ]] && printf '%s=' "$path" && cat "$path" || true
          done

          command -v free >/dev/null && free -h || true
          for path in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /proc/loadavg; do
            [[ -r "$path" ]] && printf '%s=' "$path" && cat "$path" || true
          done
          command -v uptime >/dev/null && uptime || true

          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -n "$chrome_bin" ]]; then
            printf 'chrome_executable=%s\n' "$(readlink -f "$chrome_bin")"
            "$chrome_bin" --version || true
          else
            printf 'chrome_executable=unavailable\n'
          fi
          env | sort | grep -E '^(CHROME|CHROMIUM|PUPPETEER|LIGHTHOUSE|LH_)' || true

          node --version || true
          npm --version || true

      # No build step: `lighthouse:ci` owns the build so the artifact it measures is the one its
      # provenance marker describes (clean-tree gate → build → marker → re-verify at measurement
      # time). Building here separately is what produced the rejected build it had to quarantine.
      # ubuntu-latest ships Chrome preinstalled, so no browser download is needed.
      - name: Governed Lighthouse over HTTP/2 (doc 20 §5.1, D20-25)
        env:
          LH_PROFILES: ${{ matrix.profile }}
        run: npm run lighthouse:ci

      # Reports are preserved even when the assertions fail — that is when they are most useful.
      # All three runs behind every median stay inspectable after the fact.
      #
      # The artifact name carries the PROFILE. `actions/upload-artifact@v4` errors on a duplicate
      # name rather than merging, so two shards sharing one name would fail the second upload.
      #
      # MEASURED CONSEQUENCE, recorded rather than hidden: total Lighthouse artifact bytes rose
      # 37.0 MB -> 49.1 MB (+32.7 %). lhci writes every report TWICE — once under `<profile>/`
      # (the configured outputDir, which is what the gates read) and once at `.lighthouseci/` root
      # as `lhr-<ts>.{json,html}`. Unsharded, the second `autorun` wiped the first's root copies, so
      # only ONE duplicate set survived; one set per shard now survives. The duplication is lhci's,
      # not this change's. It is NOT excluded here because `provenance.json` binds every walked file
      # by hash, so dropping the root copies from the artifact would leave dangling references —
      # that fix belongs with the provenance walk, not with an upload filter. Actions storage is
      # free on public repositories, so this costs ~3 s of upload and no money.
      #
      # `include-hidden-files: true` is REQUIRED, not cosmetic. `.lighthouseci/` is dot-prefixed, and
      # actions/upload-artifact@v4 defaults that input to false — so run 30221448099 uploaded ZERO
      # files while the step itself reported success, and the raw LHR JSON for all 24 readings is
      # unrecoverable. `if-no-files-found: error` makes the next silent loss impossible: this step
      # runs on `always()` immediately after a gate that is expected to fail sometimes, so "no files"
      # always means the collection or the path is broken, never a legitimate empty result.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ matrix.profile }}-${{ github.sha }}
          path: .lighthouseci/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error

  # End-to-end + accessibility lane (doc 18 §3, D18-3). Separate job from `verify` so a browser
  # download and a full e2e run never slow the fast feedback loop, and so an e2e failure is
  # attributable on sight. It changes NO existing threshold, budget, or job.
  #
  # No live API: `scripts/ci-preview.mjs` serves the built Nitro output behind a Prism mock of the
  # COMMITTED contract — the same orchestration the Lighthouse gate uses, so both lanes measure the
  # artifact the deploy ships (doc 00 §3 repository independence).
  e2e:
    name: E2E · Accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same build-time placeholders as `verify`: canonical/hreflang/sitemap are baked at build time
      # and a non-localhost origin keeps @nuxtjs/seo quiet (D23-8).
      NUXT_PUBLIC_SITE_URL: https://example.com
      NUXT_PUBLIC_API_BASE: https://example.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium only — the suite declares a single chromium project. `--with-deps` installs the
      # system libraries the runner does not ship.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck e2e suite
        run: npm run typecheck:e2e

      # The e2e suite drives the real production output, not the dev server: SSR correctness,
      # hydration and route rules are exactly what it exists to protect. `playwright.config.ts`
      # fails fast with an actionable message if this build is missing.
      - name: Build
        run: npm run build

      - name: Playwright + axe
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
