name: CI

# M1 quality gate (doc 17, task T8/T9). Runs with no API dependency — Vitest passes without a
# backend, and the build + bundle-isolation check assert the two-worlds boundary (D06-1/D06-5).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders; the real hosts are injected per environment at runtime (D23-8).
      # A non-localhost origin also keeps @nuxtjs/seo's site-config quiet during the build.
      NUXT_PUBLIC_SITE_URL: https://example.com
      NUXT_PUBLIC_API_BASE: https://example.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs the `postinstall` hook (`nuxt prepare`), which generates `.nuxt/` — including
      # the ESLint flat config and typed auto-imports that lint and typecheck rely on.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert bundle isolation
        run: npm run check:bundle

      - name: Assert logical properties (RTL)
        run: npm run check:logical
