# Production deploy — Nuxt/Nitro web → Contabo VPS (doc 23 §3 "Web release", D23-9).
#
# TRIGGERS:
#   push -> main        : happy path — a merged dev->main promotion (or authorized push).
#   pull_request:closed : the merged-PR FALLBACK (deploy-fallback.yml) dispatches this
#                         workflow via workflow_dispatch with target_sha, because the
#                         push->main event is intermittently dropped by GitHub (proven in
#                         the runbook). Both converge on this exact-SHA path.
#   workflow_dispatch   : manual recovery / the fallback dispatcher (optional target_sha).
# No tag trigger, no manual approval gate, no scheduled reconciliation (cost + schedule
# reliability — owner Option 4). Direct pushes to main are prohibited by policy.
#
# EXACT-SHA + IDEMPOTENCY: `preflight` resolves the target SHA (push -> github.sha;
# workflow_dispatch -> target_sha, which must equal github.sha), asserts it is the current
# main tip, and reads the live release SHA over SSH. It emits action = release /
# already-current / superseded. verify + deploy run ONLY when action == release, so a
# same-SHA push+fallback pair is idempotent (one releases; the queued one no-ops at
# preflight). The whole workflow shares one concurrency group so only one path mutates the
# server, and the deploy job re-checks github.sha == current main immediately before any
# mutation. NOTE: the preflight action value must never contain the string "deploy" — it
# is the DEPLOY_USER secret's value, and GitHub drops any output containing a secret.
# A `[skip ci]` on a main commit must never be used.
#
# ROLLBACK (no rebuild — doc 23 §3): the deploy auto-rolls-back (repoints `current` at the
# previous release + restart) if the post-cutover health gate fails. Manual form:
#     ln -sfn /srv/eslammuatamed-web/releases/<previous> /srv/eslammuatamed-web/current.new
#     mv -Tf  /srv/eslammuatamed-web/current.new /srv/eslammuatamed-web/current
#     sudo systemctl restart eslammuatamed-web
#
# DEVIATION from doc 23 §3: the full Playwright post-deploy smoke suite (D18-3) is not
# wired here yet — the `/` + `/ar` health gate stands in. A deliberate follow-up.
#
# SERVER LAYOUT (full contract in the deploy runbook):
#   /srv/eslammuatamed-web/releases/<id>   extracted release (id = <UTC-ts>-<short-sha>)
#   /srv/eslammuatamed-web/shared/.env     runtime env, server-side only — never in a release
#   /srv/eslammuatamed-web/current         symlink → the live release
#   systemd unit: eslammuatamed-web  ·  deploy user: scoped sudoers for the restart only.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact main commit SHA to release (must equal current main). Empty = current main.'
        required: false
        type: string

# One production deployment at a time across EVERY path (push + fallback dispatch); an
# in-flight deploy must finish (never cancel a cutover). The queued path no-ops at preflight.
concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Resolve + validate the exact target SHA and decide the action. Runs first (after
  # acquiring the concurrency slot), reads the live release SHA over SSH, and short-circuits
  # already-current / superseded so the second path of a same-SHA pair is a cheap no-op.
  preflight:
    name: Preflight — resolve & validate exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.pf.outputs.action }}
      sha: ${{ steps.pf.outputs.sha }}
      trigger: ${{ steps.pf.outputs.trigger }}
    steps:
      - name: Write deploy key + pin host key (read-only preflight use)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"; chmod 600 "$HOME/.ssh/deploy_key"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "DEPLOY_KNOWN_HOSTS secret is empty" >&2; exit 1; }
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Resolve trigger, validate SHA == current main, check already-current
        id: pf
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          TARGET_INPUT: ${{ github.event.inputs.target_sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          echo "trigger=$EVENT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy preflight"
            echo "- trigger: \`$EVENT\`"
            echo "- source branch: \`$REF\`"
            echo "- source/target SHA: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Production is main only.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::ref '$REF' is not refs/heads/main."
            echo "action=abort" >> "$GITHUB_OUTPUT"; exit 1
          fi
          # A dispatched target_sha (from the merged-PR fallback) must match github.sha
          # exactly — never release a stale/mismatched SHA.
          if [ -n "${TARGET_INPUT:-}" ] && [ "$TARGET_INPUT" != "$SHA" ]; then
            echo "target_sha ($TARGET_INPUT) != github.sha ($SHA) — superseded."
            echo "- result: **superseded** (target_sha != github.sha)" >> "$GITHUB_STEP_SUMMARY"
            echo "action=superseded" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # github.sha must be the current main tip. Resolve it from the GIT backend
          # (ls-remote), NOT the REST API: during GitHub incidents the REST replica can
          # lag or 503 while the git backend stays healthy (observed 2026-07-20 — both
          # trigger runs failed on this very lookup). Bounded retries ride out blips.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          MAIN=""
          for attempt in 1 2 3 4 5; do
            if MAIN="$(git -c http.extraHeader="$AUTH" ls-remote "https://github.com/${REPO}.git" refs/heads/main 2>/dev/null | cut -f1)" && [ -n "$MAIN" ]; then
              break
            fi
            echo "main-tip lookup attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep "$((attempt * 5))"
          done
          if [ -z "$MAIN" ]; then
            echo "::error::could not resolve the current main tip from the git backend."
            echo "action=abort" >> "$GITHUB_OUTPUT"; exit 1
          fi
          if [ "$SHA" != "$MAIN" ]; then
            echo "github.sha ($SHA) != current main ($MAIN) — superseded."
            echo "- result: **superseded** (github.sha != current main)" >> "$GITHUB_STEP_SUMMARY"
            echo "action=superseded" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Already live? Read the live release id (<ts>-<short7sha>) and compare the sha.
          LIVE="$(ssh -i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" \
            'readlink -f /srv/eslammuatamed-web/current 2>/dev/null | sed "s#.*/##"' | sed 's/^.*-//' || true)"
          echo "live release short SHA: '${LIVE:-none}'  target short SHA: '${SHA:0:7}'"
          if [ -n "$LIVE" ] && [ "$LIVE" = "${SHA:0:7}" ]; then
            echo "- result: **already current** (\`$LIVE\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "action=already-current" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # action value MUST NOT contain the string that is the DEPLOY_USER secret ("deploy"):
          # GitHub masks any output value containing a secret and drops the output entirely,
          # which would make every gated job skip. Use "release" (see the if: conditions).
          echo "- decision: **release** (currently live: \`${LIVE:-none}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "action=release" >> "$GITHUB_OUTPUT"

  # Release gate — mirrors ci.yml `verify`. Runs only for a real release.
  verify:
    name: Lint · Typecheck · Test · Build · Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: preflight
    if: needs.preflight.outputs.action == 'release'
    env:
      # Build-time placeholders (mirrors CI): a non-localhost origin keeps @nuxtjs/seo's
      # site-config quiet. The isolation checks scan the build output, not the host values.
      NUXT_PUBLIC_SITE_URL: https://example.com
      NUXT_PUBLIC_API_BASE: https://example.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs postinstall (`nuxt prepare`), which generates .nuxt/ — the ESLint flat
      # config and typed auto-imports that lint and typecheck depend on.
      - name: Install dependencies
        run: npm ci

      - name: Enforce API types idempotence
        # app/types/api.d.ts must be a fixed point of `api:types` over the committed
        # openapi/openapi.json (doc 16 §3). Content-level compare (stat-cache safe).
        run: |
          npm run api:types
          if git show HEAD:app/types/api.d.ts | diff -u - app/types/api.d.ts; then
            echo "app/types/api.d.ts is a fixed point of api:types."
          else
            echo "::error::app/types/api.d.ts is stale vs openapi/openapi.json — run 'npm run api:types' and commit the result." >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert bundle isolation
        run: npm run check:bundle

      - name: Assert logical properties (RTL)
        run: npm run check:logical

  deploy:
    name: Build · Ship · Cut over
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cannot start unless preflight decided `release` AND verification of THIS run (same
    # github.sha) passes.
    needs: [preflight, verify]
    if: needs.preflight.outputs.action == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Confirm checked-out HEAD == github.sha
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          [ "$HEAD_SHA" = "$SHA" ] || { echo "::error::HEAD ($HEAD_SHA) != github.sha ($SHA)"; exit 1; }
          echo "Building exact SHA $SHA."

      # API-before-Web: the web is built against the production API origin, so confirm that
      # origin is healthy before we cut over. A dead API blocks the web release.
      - name: Verify production API origin is healthy
        run: |
          set -euo pipefail
          echo "Checking production API origin before releasing web..."
          curl --fail --retry 3 --retry-delay 5 --max-time 10 \
            https://api.eslammuatamed.com/api/v1/health
          echo "Production API origin is healthy."

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Compute release id (UTC timestamp + short SHA)
        run: echo "RELEASE=$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - run: npm ci

      # Production build. Real public hosts are baked here (D23-13, public — not secrets)
      # so any build-frozen reference (i18n baseUrl, SEO canonicals) is correct; shared/.env
      # re-provides them at runtime for Nitro's runtimeConfig.public override.
      - name: Build (Nitro node-server → .output)
        env:
          NUXT_PUBLIC_SITE_URL: https://eslammuatamed.com
          NUXT_PUBLIC_API_BASE: https://api.eslammuatamed.com/api/v1
        run: npm run build

      # Release tarball — the self-contained Nitro bundle (.output carries its own bundled
      # node_modules) plus package.json for reference. No .env: runtime env is server-side.
      - name: Package release tarball
        run: tar -czf "eslammuatamed-web-${RELEASE}.tar.gz" .output package.json

      - name: Write deploy key and pin the host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Host key pinned from the DEPLOY_KNOWN_HOSTS secret (runbook B6: ssh-keyscan -H
          # output captured at provisioning). No trust-on-first-use: a MITM or a re-keyed
          # server fails host verification here instead of being silently trusted. Fail
          # loudly if the secret is missing rather than writing an empty known_hosts.
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "DEPLOY_KNOWN_HOSTS secret is empty" >&2; exit 1; }
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      # Final exact-SHA re-check immediately before any server mutation (owner policy):
      # main may have moved during verify; if so, abort without touching the server —
      # the newer commit is released by its own event.
      - name: Re-check github.sha is still current main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Git-backend lookup with retries (not REST — see the preflight comment).
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          MAIN=""
          for attempt in 1 2 3 4 5; do
            if MAIN="$(git -c http.extraHeader="$AUTH" ls-remote "https://github.com/${REPO}.git" refs/heads/main 2>/dev/null | cut -f1)" && [ -n "$MAIN" ]; then
              break
            fi
            echo "main-tip lookup attempt $attempt failed; retrying in $((attempt * 5))s..."
            sleep "$((attempt * 5))"
          done
          if [ -z "$MAIN" ]; then
            echo "::error::could not resolve the current main tip; refusing to cut over blind."
            exit 1
          fi
          if [ "$MAIN" != "$SHA" ]; then
            echo "::warning::main moved to $MAIN since preflight; aborting cutover (superseded)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ship the tarball
        if: steps.gate.outputs.proceed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          TARBALL="eslammuatamed-web-${RELEASE}.tar.gz"
          scp -i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$TARBALL" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/${TARBALL}"

      - name: Extract, cut over, health-gate (/ and /ar), auto-rollback, prune
        id: cutover
        if: steps.gate.outputs.proceed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # RELEASE has no shell-special characters (timestamp + hex SHA), so it is safe
          # to pass as a positional arg into the quoted (non-expanding) remote heredoc.
          ssh -i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "$RELEASE" <<'REMOTE'
          set -euo pipefail
          RELEASE="$1"
          BASE=/srv/eslammuatamed-web
          REL_DIR="$BASE/releases/$RELEASE"
          TARBALL="/tmp/eslammuatamed-web-${RELEASE}.tar.gz"

          # Capture the currently-live release up front so an unhealthy new release can be
          # auto-rolled-back (symlink only; no rebuild — doc 23 §3).
          PREV="$(readlink -f "$BASE/current" 2>/dev/null || true)"

          # 1. Extract the release (self-contained; carries no secrets).
          mkdir -p "$REL_DIR"
          tar -xzf "$TARBALL" -C "$REL_DIR"
          rm -f "$TARBALL"

          # 2. Atomic cut over: build the new symlink beside `current`, then rename over it
          #    (mv -T is atomic; a bare `ln -sfn` is unlink-then-symlink, briefly dangling).
          ln -sfn "$REL_DIR" "$BASE/current.new"
          mv -Tf "$BASE/current.new" "$BASE/current"

          # 3. Restart via the scoped sudoers rule (systemctl restart eslammuatamed-web only).
          sudo systemctl restart eslammuatamed-web

          # 4. Health gate (both locales: / LTR and /ar RTL) with AUTOMATIC rollback on
          #    failure. --retry-connrefused rides out the boot window.
          if curl --fail --retry 5 --retry-delay 3 --retry-connrefused --max-time 10 http://127.0.0.1:3000/ \
             && curl --fail --retry 5 --retry-delay 3 --retry-connrefused --max-time 10 http://127.0.0.1:3000/ar; then
            echo "Health gate passed (/ and /ar) for release $RELEASE."
          else
            echo "Health gate FAILED for $RELEASE — rolling the web back." >&2
            if [ -n "$PREV" ] && [ -d "$PREV" ] && [ "$PREV" != "$REL_DIR" ]; then
              ln -sfn "$PREV" "$BASE/current.new"
              mv -Tf "$BASE/current.new" "$BASE/current"
              sudo systemctl restart eslammuatamed-web
              if curl --fail --retry 5 --retry-delay 3 --retry-connrefused --max-time 10 http://127.0.0.1:3000/; then
                echo "Rolled back to previous release ($PREV); it is healthy." >&2
              else
                echo "Rolled back to $PREV but health still failing — MANUAL INTERVENTION REQUIRED." >&2
              fi
            else
              echo "No previous healthy release to roll back to — MANUAL INTERVENTION REQUIRED." >&2
            fi
            exit 1
          fi

          # 5. Keep the last 5 releases (the live one is newest, so always retained).
          #    Only reached on a healthy release — a rolled-back run exits above.
          cd "$BASE/releases"
          ls -1dt */ | tail -n +6 | xargs -r rm -rf
          REMOTE

      - name: Deploy summary (observability)
        if: always()
        env:
          TRIGGER: ${{ needs.preflight.outputs.trigger }}
          SHA: ${{ github.sha }}
          PROCEED: ${{ steps.gate.outputs.proceed }}
          CUTOVER: ${{ steps.cutover.outcome }}
        run: |
          {
            echo "### Deploy result"
            echo "- trigger: \`$TRIGGER\`"
            echo "- released SHA: \`$SHA\`"
            echo "- release: \`${RELEASE:-<none>}\`"
            if [ "${PROCEED:-}" != "true" ]; then
              echo "- result: **superseded** (main moved during verify; no server mutation)"
            elif [ "${CUTOVER:-}" = "success" ]; then
              echo "- result: **released** (post-cutover health gate passed; auto-rollback armed)"
            else
              echo "- result: **FAILED** (cutover/health outcome: \`${CUTOVER:-unknown}\`; auto-rollback attempted — check logs)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
